version: '3.8'

services:
  facechain:
    build: .
    container_name: facechain-app
    ports:
      - "8501:8501"
    environment:
      - SEARCH_PROVIDER=yandex
      - SEARCH_HEADLESS=true
      - FACE_MATCH_THRESHOLD=0.45
      - BLOCKCHAIN_RPC_URL=http://127.0.0.1:8545
    restart: unless-stopped
